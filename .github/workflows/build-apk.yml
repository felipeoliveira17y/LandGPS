name: Build GPS Landmensure APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      LANDMENSURE_PUBLIC_WEB_URL: ${{ vars.LANDMENSURE_PUBLIC_WEB_URL }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar plataforma Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Validar configuração do Supabase
        run: |
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Crie o Secret SUPABASE_PUBLISHABLE_KEY nas configurações do repositório."
            exit 1
          fi

      - name: Executar testes unitários
        run: gradle --no-daemon testDirectDebugUnitTest

      - name: Executar análise estática
        run: gradle --no-daemon lintDirectDebug

      - name: Compilar APK de depuração
        run: gradle --no-daemon assembleDirectDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Landmensure-debug-apk
          path: app/build/outputs/apk/direct/debug/app-direct-debug.apk
          if-no-files-found: error
