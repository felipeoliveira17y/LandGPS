name: Generate signed Landmensure release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Código numérico maior que o da versão anterior"
        required: true
        default: "16"
      version_name:
        description: "Versão exibida, por exemplo 2.3.3"
        required: true
        default: "2.3.3"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/landmensure-release.keystore
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Validar secrets de release
        run: |
          for value in SUPABASE_PUBLISHABLE_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "::error::Configure o Secret $value antes de gerar uma versão de release."
              exit 1
            fi
          done

      - name: Preparar keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"

      - name: Testar, analisar e gerar APK assinado
        run: gradle --no-daemon testDebugUnitTest lintDebug -PversionCode=${{ inputs.version_code }} -PversionName=${{ inputs.version_name }} assembleRelease

      - name: Publicar APK assinado
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Landmensure-${{ inputs.version_name }}-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
