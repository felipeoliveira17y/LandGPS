<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coletor GPS Rural</title>
<style>
body{font-family:Arial;margin:0;background:#eef2f5}
header{background:#0a6;color:#fff;padding:14px}
.wrap{padding:12px}
button{padding:12px 16px;border:0;border-radius:8px;cursor:pointer}
#map{height:320px;border-radius:10px}
.card{background:#fff;padding:12px;border-radius:10px;margin:10px 0}
table{width:100%;border-collapse:collapse}
td,th{border:1px solid #ddd;padding:6px;font-size:12px}
</style>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

</head>

<body>

<header>
<h2>Coletor GPS • SIRGAS2000 / UTM Automática</h2>
</header>

<div class="wrap">

<div class="card">
<button onclick="capturar()">📌 Coletar Ponto</button>
<button onclick="exportCSV()">📄 CSV</button>
<button onclick="exportKML()">📁 KML</button>
</div>

<div class="card">
Precisão:
<span id="acc">-</span> m
<br>
Área:
<span id="area">0</span> m² /
<span id="ha">0</span> ha
<br>
Perímetro:
<span id="per">0</span> m
</div>

<div id="map"></div>

<div class="card">

<table>

<thead>

<tr>
<th>Vértice</th>
<th>Latitude</th>
<th>Longitude</th>
<th>UTM X</th>
<th>UTM Y</th>
<th>Zona</th>
</tr>

</thead>

<tbody id="tb"></tbody>

</table>

</div>

<div class="card">
<h3>Memorial</h3>
<div id="memorial"></div>
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map=L.map("map").setView([-3.73,-38.52],18);

L.tileLayer(
"https://tile.openstreetmap.org/{z}/{x}/{y}.png"
).addTo(map);

let pontos=[];
let markers=[];
let poly;

function converterUTM(lat, lon){

const a=6378137;
const f=1/298.257222101;
const k0=0.9996;

const e=Math.sqrt(2*f-f*f);

const zona=Math.floor((lon+180)/6)+1;

const lon0=(zona-1)*6-180+3;

const latRad=lat*Math.PI/180;
const lonRad=lon*Math.PI/180;
const lon0Rad=lon0*Math.PI/180;

const N=
a/
Math.sqrt(
1-e*e*Math.sin(latRad)**2
);

const T=
Math.tan(latRad)**2;

const C=
(
e*e/
(1-e*e)
)
*
Math.cos(latRad)**2;

const A=
Math.cos(latRad)
*
(
lonRad-lon0Rad
);

const M=
a*
(
(1-e*e/4-3*e**4/64)
*
latRad
);

let X=
k0*
N*
(
A+
(1-T+C)
*
A**3
/
6
)
+
500000;

let Y=
k0*
(
M+
N*
Math.tan(latRad)
*
(
A*A
/
2
)
);

if(lat<0)
Y+=10000000;

return{
x:X.toFixed(3),
y:Y.toFixed(3),
zona:zona+(lat<0?"S":"N")
};

}

function dist(a,b){

const R=6371000;

const dLat=
(b.lat-a.lat)
*
Math.PI
/
180;

const dLon=
(b.lng-a.lng)
*
Math.PI
/
180;

const x=
Math.sin(dLat/2)**2
+
Math.cos(a.lat*Math.PI/180)
*
Math.cos(b.lat*Math.PI/180)
*
Math.sin(dLon/2)**2;

return 2*R*Math.atan2(
Math.sqrt(x),
Math.sqrt(1-x)
);

}

function areaPoligono(coords){

if(coords.length<3)
return 0;

let area=0;

for(let i=0;i<coords.length;i++){

let j=
(i+1)
%
coords.length;

area+=
coords[i].lng*
coords[j].lat;

area-=
coords[j].lng*
coords[i].lat;

}

return Math.abs(area/2)*111139*111139;

}

function atualizar(){

markers.forEach(
m=>map.removeLayer(m)
);

markers=[];

pontos.forEach(
(p,i)=>{

markers.push(

L.marker(
[p.lat,p.lng]
)

.addTo(map)

.bindPopup(
"P"+(i+1)
)

);

});

if(poly)
map.removeLayer(poly);

if(
pontos.length>1
){

poly=
L.polygon(

pontos.map(
p=>[
p.lat,
p.lng
]
)

).addTo(map);

}

let tb=
document.getElementById("tb");

tb.innerHTML="";

pontos.forEach(
(p,i)=>{

let utm=
converterUTM(
p.lat,
p.lng
);

tb.innerHTML+=`

<tr>

<td>P${i+1}</td>

<td>${p.lat.toFixed(8)}</td>

<td>${p.lng.toFixed(8)}</td>

<td>${utm.x}</td>

<td>${utm.y}</td>

<td>${utm.zona}</td>

</tr>

`;

});

let per=0;

for(
let i=0;
i<pontos.length-1;
i++
){
per+=dist(
pontos[i],
pontos[i+1]
);
}

if(
pontos.length>2
){
per+=dist(
pontos[pontos.length-1],
pontos[0]
);
}

let area=
areaPoligono(
pontos
);

document.getElementById("area")
.innerHTML=
area.toFixed(2);

document.getElementById("ha")
.innerHTML=
(area/10000)
.toFixed(4);

document.getElementById("per")
.innerHTML=
per.toFixed(2);

let mem="";

pontos.forEach(
(p,i)=>{

let utm=
converterUTM(
p.lat,
p.lng
);

mem+=`

<b>P${i+1}</b>

<br>

Latitude:
${p.lat.toFixed(8)}

<br>

Longitude:
${p.lng.toFixed(8)}

<br>

UTM:
X ${utm.x}
/
Y ${utm.y}

<br>

Zona:
${utm.zona}

<br><br>

`;

});

mem+=`

<hr>

Área:
${area.toFixed(2)}
m²

<br>

Área:
${(area/10000).toFixed(4)}
ha

<br>

Perímetro:
${per.toFixed(2)}
m

`;

document.getElementById(
"memorial"
).innerHTML=
mem;

}

function capturar(){

navigator.geolocation.getCurrentPosition(

pos=>{

let lat=
pos.coords.latitude;

let lng=
pos.coords.longitude;

document.getElementById(
"acc"
).innerHTML=
pos.coords.accuracy.toFixed(1);

pontos.push({
lat,
lng
});

map.setView(
[
lat,
lng
],
19
);

atualizar();

},

e=>alert(
e.message
),

{
enableHighAccuracy:true
}

);

}

function baixar(
nome,
conteudo
){

let a=
document.createElement(
"a"
);

a.href=
URL.createObjectURL(
new Blob(
[conteudo]
)
);

a.download=
nome;

a.click();

}

function exportCSV(){

let t=
"Vertice,Latitude,Longitude\n";

pontos.forEach(
(p,i)=>{

t+=
`P${i+1},${p.lat},${p.lng}\n`;

});

baixar(
"levantamento.csv",
t
);

}

function exportKML(){

let k=
'<?xml version="1.0"?><kml><Document>';

pontos.forEach(
(p,i)=>{

k+=`

<Placemark>

<name>P${i+1}</name>

<Point>

<coordinates>

${p.lng},
${p.lat}

</coordinates>

</Point>

</Placemark>

`;

});

k+=
"</Document></kml>";

baixar(
"levantamento.kml",
k
);

}

</script>

</body>
</html>
